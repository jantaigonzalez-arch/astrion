# Stack de producción — un solo VPS.
#
#   nginx  :80/:443  → TLS y enrutado por dominio
#     ├── evoelution.com               → web (este proyecto)
#     └── cromatografia.evoelution.com → evo_ai (perfil "cromatografia")
#   postgres          → volumen persistente
#   migrate           → corre una vez y sale, antes de que arranque web
#   backup            → pg_dump diario
#
# Arranque:  docker compose -f docker-compose.prod.yml up -d --build
# Con ML:    ... --profile cromatografia up -d --build
#
# Las variables sensibles se leen de deploy/.env (ver deploy/.env.example).
# Nunca se escriben aquí: este archivo va al repo.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evoelution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-evoelution}
      # La MISMA zona que la aplicación, y por la misma razón. Postgres decide
      # aquí qué significan `now()`, `current_date` y `date_trunc('month', …)`:
      # con la base en UTC y la aplicación en México, el corte de mes de los
      # informes cae seis horas antes que el cambio de día que ve el usuario, y
      # las ventas del último día del mes aparecen en el mes siguiente.
      TZ: ${TZ:-America/Mexico_City}
      PGTZ: ${TZ:-America/Mexico_City}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin `ports`: la base NO se expone a internet. Solo la alcanzan los
    # contenedores de esta red. Para conectarte desde afuera, túnel SSH.
    #
    # El techo de empresas concurrentes es aritmética de conexiones, no de CPU
    # ni de disco. Con el aislamiento por esquema, cada empresa ACTIVA mantiene
    # su propio pool:
    #
    #   max_connections − reservadas − pool del plano de control
    #   ─────────────────────────────────────────────────────────  = empresas
    #                DB_TENANT_POOL_MAX                              a la vez
    #
    # Con el default de Postgres (100) daban ~29. Pasada esa cifra la petición
    # no falla: se queda esperando una conexión libre, que es peor de
    # diagnosticar. Con 300 el techo sube a ~95 empresas activas a la vez
    # (activa = con actividad en los últimos DB_TENANT_IDLE segundos).
    #
    # No es gratis: cada conexión reserva memoria de backend. Súbelo junto con
    # la RAM del VPS, no en abstracto. shared_buffers en ~25% de la RAM.
    command: >
      postgres
      -c max_connections=${PG_MAX_CONNECTIONS:-300}
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evoelution} -d ${POSTGRES_DB:-evoelution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Aplica las migraciones pendientes y termina. `web` espera a que salga bien,
  # así que nunca corre una versión de la app contra un schema viejo.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoelution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evoelution}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoelution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evoelution}
      # Se repite lo que ya fija el Dockerfile para que se pueda cambiar sin
      # reconstruir la imagen: quien opera el despliegue toca `deploy/.env`.
      TZ: ${TZ:-America/Mexico_City}
      AUTH_SECRET: ${AUTH_SECRET:?generá uno con `openssl rand -base64 32`}
      AUTH_TRUST_HOST: "true"
      # Dónde vive el login. Explícito y no derivado de ROOT_DOMAIN a propósito:
      # la sustitución anidada de Compose (`${A:-${B}}`) no se comporta igual en
      # todas las versiones, y una AUTH_URL mal resuelta no falla al arrancar —
      # falla al iniciar sesión, que es mucho peor de diagnosticar.
      #
      #   una empresa   AUTH_DOMAIN = APP_DOMAIN   (evoelution.com)
      #   multiempresa  AUTH_DOMAIN = ROOT_DOMAIN  (astraion.com)
      AUTH_URL: https://${AUTH_DOMAIN:?definí AUTH_DOMAIN en deploy/.env}
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?definí APP_DOMAIN en deploy/.env}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
      # Activa el modo subdominio. Sin esta variable la aplicación resuelve el
      # inquilino por el primer segmento del path, exactamente como antes: la
      # migración se puede hacer y deshacer sin desplegar código nuevo.
      #
      # Se lee solo en el servidor. El navegador no la necesita —recibe el modo
      # desde el layout del inquilino— y por eso NO lleva el prefijo
      # NEXT_PUBLIC_, que además la congelaría en el build en vez de leerla del
      # entorno del contenedor.
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      # Conexión directa a Postgres (sin pooler): los prepared statements sí
      # se pueden usar y ahorran replanificar cada consulta.
      DB_PREPARE: "true"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Conexiones por empresa activa. Junto con max_connections del servicio
      # postgres, fijan cuántas empresas se atienden a la vez. Ver la nota ahí.
      DB_TENANT_POOL_MAX: ${DB_TENANT_POOL_MAX:-3}
      DB_TENANT_IDLE: ${DB_TENANT_IDLE:-20}
      # Pools de empresa vivos en memoria antes de cerrar el menos usado.
      DB_TENANT_POOL_CACHE: ${DB_TENANT_POOL_CACHE:-64}
      UPLOADS_DIR: /data/uploads
      # Red interna: el ML se llama servidor-a-servidor, sin salir a internet.
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://evoai-backend:8000}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      # Solo lo usa la plantilla de multiempresa. Vacío en modo una empresa.
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      ML_DOMAIN: ${ML_DOMAIN:-cromatografia.evoelution.com}
      # Solo sustituir estas dos: sin el filtro, envsubst se comería $host,
      # $remote_addr y el resto de variables propias de nginx.
      NGINX_ENVSUBST_FILTER: "^(APP_DOMAIN|ML_DOMAIN|ROOT_DOMAIN)$$"
    volumes:
      # La imagen procesa /etc/nginx/templates/*.template con envsubst y
      # escribe el resultado en /etc/nginx/conf.d/ al arrancar.
      #
      # Cuál se monta depende del modo (ver deploy/.env.example):
      #   una-empresa   un dominio, sin comodín  ← por defecto
      #   multiempresa  apex + *.dominio, exige certificado comodín
      #
      # nginx NO arranca si referencia un certificado que no existe, así que
      # montar la plantilla de multiempresa sin haber emitido el comodín tumba
      # el sitio entero. Por eso el modo es explícito y no se deduce.
      - ./deploy/nginx/${NGINX_TEMPLATES:-una-empresa}:/etc/nginx/templates:ro
      # Las fotos las sirve nginx directo desde el volumen: no tiene sentido
      # despertar a Node para devolver un JPG.
      - uploads:/srv/uploads:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  # Renueva los certificados. Let's Encrypt emite a 90 días; este bucle
  # reintenta cada 12 h y solo actúa cuando faltan menos de 30.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

  # Respaldo diario. Es la contrapartida de tener Postgres en el mismo host:
  # sin esto, un disco perdido es el negocio perdido.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "while :; do
               ts=$$(date +%Y%m%d-%H%M%S);
               pg_dump -h postgres -U ${POSTGRES_USER:-evoelution} -d ${POSTGRES_DB:-evoelution} -Fc
                 > /backups/evoelution-$$ts.dump
                 && echo \"[backup] ok evoelution-$$ts.dump\"
                 || echo '[backup] FALLÓ';
               find /backups -name '*.dump' -mtime +$${RETENTION_DAYS} -delete;
               sleep 24h;
             done"

  # Copia los dumps FUERA del servidor.
  #
  # Sin esto, `backup` escribe a un volumen del mismo host: un disco perdido se
  # lleva los datos y los respaldos juntos, que es lo mismo que no tener
  # respaldo. Va en un perfil porque necesita credenciales que hay que sacar
  # aparte, pero NO es opcional antes de cargar datos reales.
  #
  #   docker compose -f docker-compose.prod.yml --profile respaldo-remoto up -d
  #
  # rclone habla con Storage Box de Hetzner (sftp), S3, Backblaze B2 y demás.
  # La configuración va por variables RCLONE_CONFIG_*, sin archivo que montar.
  # Ejemplo para Storage Box, en deploy/.env:
  #
  #   RCLONE_CONFIG_REMOTO_TYPE=sftp
  #   RCLONE_CONFIG_REMOTO_HOST=uXXXXX.your-storagebox.de
  #   RCLONE_CONFIG_REMOTO_USER=uXXXXX
  #   RCLONE_CONFIG_REMOTO_PASS=<obtenido con: rclone obscure 'tu-contraseña'>
  #   BACKUP_REMOTE=REMOTO:/respaldos/evoelution
  backup-offsite:
    profiles: ["respaldo-remoto"]
    image: rclone/rclone:latest
    restart: unless-stopped
    environment:
      # `:-` y no `:?`: Compose interpola TODO el archivo antes de filtrar por
      # perfil, así que exigirla aquí abortaría un `up -d` normal que ni
      # siquiera levanta este servicio. Se comprueba en el arranque, abajo.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_REMOTO_TYPE: ${RCLONE_CONFIG_REMOTO_TYPE:-}
      RCLONE_CONFIG_REMOTO_HOST: ${RCLONE_CONFIG_REMOTO_HOST:-}
      RCLONE_CONFIG_REMOTO_USER: ${RCLONE_CONFIG_REMOTO_USER:-}
      RCLONE_CONFIG_REMOTO_PASS: ${RCLONE_CONFIG_REMOTO_PASS:-}
      RCLONE_CONFIG_REMOTO_PROVIDER: ${RCLONE_CONFIG_REMOTO_PROVIDER:-}
      RCLONE_CONFIG_REMOTO_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTO_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTO_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTO_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTO_ENDPOINT: ${RCLONE_CONFIG_REMOTO_ENDPOINT:-}
      RCLONE_CONFIG_REMOTO_REGION: ${RCLONE_CONFIG_REMOTO_REGION:-}
    volumes:
      - backups:/backups:ro
    # `copy` y no `sync`: sync borraría en el destino lo que ya no está en el
    # origen, así que la retención local de 14 días se propagaría al remoto y
    # perderías la copia vieja justo cuando la necesitás. El remoto conserva.
    #
    # Corre 20 minutos después que el dump para no copiar un archivo a medias.
    entrypoint: >
      sh -c "if [ -z \"$$BACKUP_REMOTE\" ]; then
               echo '[offsite] BACKUP_REMOTE está vacío: no hay a dónde copiar.';
               echo '[offsite] Configuralo en deploy/.env — ver los ejemplos ahí.';
               exit 1;
             fi;
             sleep 1200;
             while :; do
               rclone copy /backups \"$$BACKUP_REMOTE\" --stats-one-line
                 && echo '[offsite] ok'
                 || echo '[offsite] FALLÓ — el respaldo NO salió del servidor';
               sleep 24h;
             done"

  # ---- Cromatografía / ML (perfil opcional) --------------------------------
  # Requiere el repo evo_ai hermano de este. Se levanta con:
  #   docker compose -f docker-compose.prod.yml --profile cromatografia up -d
  # Sin el perfil, nginx responde 502 en ese subdominio y el resto funciona
  # igual: los servicios están desacoplados a propósito.
  evoai-backend:
    profiles: ["cromatografia"]
    build:
      context: ../evo_ai/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data/uploads
      - CACHE_SIZE=200
      - ALLOWED_ORIGINS=https://${ML_DOMAIN:-cromatografia.evoelution.com}
    volumes:
      - evoai_uploads:/app/data/uploads

  evoai-frontend:
    profiles: ["cromatografia"]
    build:
      context: ../evo_ai/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://${ML_DOMAIN:-cromatografia.evoelution.com}/api/v1
    depends_on:
      - evoai-backend

  # ---- Capa de inteligencia -------------------------------------------------
  #
  # El motor de ML del ERP: clasificación de intención, AutoML y pronóstico.
  # Vive aparte porque es Python —scikit-learn, XGBoost, statsmodels— y eso no
  # existe en TypeScript de forma honesta. Ver services/intelligence/.
  #
  # SIN `ports`. No se expone a internet ni al host: solo lo alcanzan los
  # contenedores de esta red, y su único cliente es `web`. Publicar el puerto
  # sería abrir un servicio que puede leer el histórico de todas las empresas.
  #
  # Sin perfil, al contrario que evoai: esto no es un módulo opcional, es parte
  # del producto. Si está caído, las pantallas de análisis se quedan sin
  # pronóstico y el ERP sigue funcionando —esa degradación está prevista en el
  # cliente TypeScript— pero no es un estado deseado.
  intelligence:
    build:
      context: ./services/intelligence
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # La MISMA base que el ERP y en el mismo nombre de variable. Este
      # servicio no tiene datos propios: lee el esquema de cada empresa y fija
      # `search_path` a ese esquema y nada más. Ver services/intelligence/app/data.py
      DATABASE_URL: postgres://${POSTGRES_USER:-evoelution}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evoelution}
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `python` y no `curl`: la imagen slim no trae curl y añadirlo solo para
      # el healthcheck son 8 MB y un paquete más que actualizar.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      # Entrenar carga scikit-learn, xgboost y polars: el primer arranque tarda
      # más que un servidor web y sin este margen el orquestador lo reinicia
      # en bucle antes de que llegue a estar listo.
      start_period: 40s

volumes:
  pgdata:
  uploads:
  backups:
  certbot_conf:
  certbot_www:
  evoai_uploads:
